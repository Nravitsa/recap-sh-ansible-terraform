
- name: disbale and enable
  ansible.builtin.shell: dnf module disable nginx -y ; module enable nginx:1.24 -y

- name: Install nginx 1.24
  ansible.builtin.dnf:
    name: nginx = 1.24
    state: present

- name: Copy nginx file
  ansible.builtin.template:
    src: nginx.conf
    dest: /etc/nginx/nginx.conf

- name: Remove default content directory
  ansible.builtin.file:
    path: /usr/share/nginx/html
    state: absent